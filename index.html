<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    誠正資優 CZJH GATE
  </title>


  <style>

    /* ==================================================
       01. BASIC SETTINGS
    ================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      background:
        #000000;

      color:
        #ffffff;

      overflow:
        hidden;

    }



    /* ==================================================
       02. LANDING PAGE
    ================================================== */

    .landing {

      position:
        relative;

      width:
        100%;

      height:
        100vh;

      min-height:
        100svh;

      overflow:
        hidden;

      background:
        #000000;

      opacity:
        1;

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;

    }



    /* ==================================================
       03. BACKGROUND PHOTO

       封面照片：

       images/cover.jpg

       照片本身向下移動，
       右側文字位置不變。

       translateY(42px)
       = 往下約 42px。
    ================================================== */

    .background {

      position:
        absolute;

      top:
        -70px;

      left:
        -70px;

      right:
        -70px;

      bottom:
        -70px;


      background-image:
        url("images/cover.jpg");


      background-size:
        cover;


      /*
        保留左側藍色旗幟。

        往左：
        40% → 35%

        往右：
        40% → 45%
      */

      background-position:
        40% center;


      transform:
        translateY(42px)
        scale(1.045);


      animation:

        backgroundFade
        1.2s
        ease
        forwards,

        backgroundZoom
        10s
        ease
        forwards;

    }



    /* ==================================================
       04. RIGHT BLACK GRADIENT

       左側保留照片。

       右側逐漸進入黑色，
       提供文字閱讀區。
    ================================================== */

    .overlay-right {

      position:
        absolute;

      inset:
        0;

      z-index:
        1;


      background:

        linear-gradient(

          90deg,

          rgba(0, 0, 0, 0.02) 0%,

          rgba(0, 0, 0, 0.04) 27%,

          rgba(0, 0, 0, 0.12) 40%,

          rgba(0, 0, 0, 0.38) 57%,

          rgba(0, 0, 0, 0.72) 72%,

          rgba(0, 0, 0, 0.92) 88%,

          rgba(0, 0, 0, 0.98) 100%

        );

    }



    /* ==================================================
       05. EDGE DARKENING

       四周輕微暗角。
    ================================================== */

    .overlay-edge {

      position:
        absolute;

      inset:
        0;

      z-index:
        1;


      background:

        radial-gradient(

          ellipse
          at
          center,

          rgba(0, 0, 0, 0) 45%,

          rgba(0, 0, 0, 0.08) 70%,

          rgba(0, 0, 0, 0.28) 100%

        );


      pointer-events:
        none;

    }



    /* ==================================================
       06. SCHOOL NAME

       右上角校名。

       中文、英文目前皆使用
       與「數理資優班」相同字級。

       點擊可前往誠正國中校網。
    ================================================== */

    .school-link {

      position:
        absolute;

      z-index:
        5;

      top:
        38px;

      right:
        clamp(
          35px,
          5vw,
          85px
        );


      /*
        因為英文校名變大，
        所以給校名區域足夠寬度。
      */

      width:
        min(
          720px,
          55vw
        );


      display:
        block;


      text-align:
        right;


      color:
        #ffffff;


      text-decoration:
        none;


      opacity:
        0;


      animation:
        fadeDown
        0.8s
        ease
        forwards;


      animation-delay:
        0.20s;


      transition:
        opacity 0.3s ease;

    }



    .school-link:hover {

      opacity:
        0.70 !important;

    }



    /* ==================================================
       SCHOOL NAME - CHINESE

       與數理資優班中文字級相同。
    ================================================== */

    .school-name-chinese {

      font-size:

        clamp(
          21px,
          1.8vw,
          29px
        );


      font-weight:
        400;


      letter-spacing:
        0.12em;


      line-height:
        1.25;


      margin-bottom:
        10px;

    }



    /* ==================================================
       SCHOOL NAME - ENGLISH

       同樣使用與數理資優班
       相同的字級。

       因英文較長，
       字距稍微縮小。
    ================================================== */

    .school-name-english {

      font-size:

        clamp(
          21px,
          1.8vw,
          29px
        );


      font-weight:
        300;


      line-height:
        1.15;


      letter-spacing:
        0.015em;


      opacity:
        0.72;

    }



    /* ==================================================
       07. MAIN CONTENT

       位置維持原本不動。

       照片移動不影響此區。
    ================================================== */

    .content {

      position:
        absolute;

      z-index:
        4;


      right:
        clamp(
          38px,
          6vw,
          110px
        );


      top:
        53%;


      transform:
        translateY(-50%);


      width:
        min(
          660px,
          45vw
        );


      text-align:
        right;

    }



    /* ==================================================
       08. MAIN TITLE
    ================================================== */

    .main-title {

      width:
        100%;

    }



    .title-line {

      display:
        block;


      font-size:

        clamp(
          39px,
          4.25vw,
          72px
        );


      font-weight:
        300;


      letter-spacing:
        -0.035em;


      line-height:
        1.02;


      opacity:
        0;


      transform:
        translateY(34px);


      text-shadow:

        0
        3px
        25px
        rgba(
          0,
          0,
          0,
          0.35
        );


      animation:

        titleReveal
        0.9s
        cubic-bezier(
          0.22,
          1,
          0.36,
          1
        )
        forwards;

    }



    .title-line:nth-child(1) {

      animation-delay:
        0.40s;

    }



    .title-line:nth-child(2) {

      animation-delay:
        0.56s;

    }



    .title-line:nth-child(3) {

      animation-delay:
        0.72s;

    }



    /* Gifted and Talented 稍微加粗 */

    .title-line.emphasis {

      font-weight:
        600;

    }



    /* ==================================================
       09. CHINESE PROGRAM NAME
    ================================================== */

    .chinese-title {

      margin-top:
        30px;


      font-size:

        clamp(
          21px,
          1.8vw,
          29px
        );


      font-weight:
        400;


      letter-spacing:
        0.20em;


      opacity:
        0;


      animation:
        fadeUp
        0.8s
        ease
        forwards;


      animation-delay:
        0.95s;

    }



    /* 數理資優班下方裝飾線 */

    .chinese-title::after {

      content:
        "";

      display:
        block;


      width:
        46px;

      height:
        1px;


      margin-top:
        18px;

      margin-left:
        auto;


      background:

        rgba(
          255,
          255,
          255,
          0.68
        );

    }



    /* ==================================================
       10. LANGUAGE AREA
    ================================================== */

    .language-area {

      display:
        flex;


      justify-content:
        flex-end;


      gap:
        14px;


      margin-top:
        31px;


      opacity:
        0;


      animation:
        fadeUp
        0.8s
        ease
        forwards;


      animation-delay:
        1.14s;

    }



    /* ==================================================
       11. LANGUAGE BUTTON
    ================================================== */

    .language-button {

      position:
        relative;


      min-width:
        165px;


      padding:
        15px
        22px;


      border:

        1px solid
        rgba(
          255,
          255,
          255,
          0.48
        );


      background:

        rgba(
          255,
          255,
          255,
          0.025
        );


      color:
        #ffffff;


      text-decoration:
        none;


      display:
        flex;


      justify-content:
        space-between;


      align-items:
        center;


      font-size:
        13px;


      font-weight:
        500;


      letter-spacing:
        0.08em;


      backdrop-filter:
        blur(8px);


      -webkit-backdrop-filter:
        blur(8px);


      overflow:
        hidden;


      cursor:
        pointer;


      transition:

        color
        0.35s
        ease,

        border-color
        0.35s
        ease,

        transform
        0.35s
        ease;

    }



    /* ==================================================
       12. LANGUAGE BUTTON HOVER
    ================================================== */

    .language-button::before {

      content:
        "";

      position:
        absolute;

      inset:
        0;


      background:
        #ffffff;


      transform:
        translateX(-101%);


      transition:

        transform
        0.40s
        cubic-bezier(
          0.77,
          0,
          0.18,
          1
        );


      z-index:
        -1;

    }



    .language-button:hover::before {

      transform:
        translateX(0);

    }



    .language-button:hover {

      color:
        #101820;


      border-color:
        #ffffff;


      transform:
        translateY(-3px);

    }



    /* ==================================================
       13. ARROW
    ================================================== */

    .arrow {

      display:
        inline-block;


      margin-left:
        28px;


      transition:
        transform
        0.30s
        ease;

    }



    .language-button:hover .arrow {

      transform:
        translateX(7px);

    }



    /* ==================================================
       14. OPTIONAL FOOTER SLOGAN

       目前不顯示。

       CSS 保留。
    ================================================== */

    .footer-note {

      position:
        absolute;

      z-index:
        5;

      bottom:
        36px;

      left:
        55px;

      font-size:
        9px;

      letter-spacing:
        0.22em;

      text-transform:
        uppercase;

      opacity:
        0;

      animation:
        footerFade
        1s
        ease
        forwards;

      animation-delay:
        1.45s;

    }



    /* ==================================================
       15. OPTIONAL YEAR

       目前不顯示。

       CSS 保留。
    ================================================== */

    .year {

      position:
        absolute;

      z-index:
        5;

      right:
        55px;

      bottom:
        34px;

      font-size:
        10px;

      letter-spacing:
        0.22em;

      opacity:
        0.55;

    }



    /* ==================================================
       16. PAGE LEAVE ANIMATION
    ================================================== */

    .landing.leaving {

      opacity:
        0;


      transform:
        scale(1.012);

    }



    /* ==================================================
       17. ANIMATIONS
    ================================================== */

    @keyframes backgroundFade {

      from {

        opacity:
          0;

      }


      to {

        opacity:
          1;

      }

    }



    @keyframes backgroundZoom {

      from {

        transform:
          translateY(42px)
          scale(1.065);

      }


      to {

        transform:
          translateY(42px)
          scale(1.025);

      }

    }



    @keyframes titleReveal {

      from {

        opacity:
          0;


        transform:
          translateY(34px);

      }


      to {

        opacity:
          1;


        transform:
          translateY(0);

      }

    }



    @keyframes fadeUp {

      from {

        opacity:
          0;


        transform:
          translateY(19px);

      }


      to {

        opacity:
          1;


        transform:
          translateY(0);

      }

    }



    @keyframes fadeDown {

      from {

        opacity:
          0;


        transform:
          translateY(-15px);

      }


      to {

        opacity:
          1;


        transform:
          translateY(0);

      }

    }



    @keyframes footerFade {

      from {

        opacity:
          0;

      }


      to {

        opacity:
          0.45;

      }

    }



    /* ==================================================
       18. TABLET
    ================================================== */

    @media (
      max-width: 1000px
    ) {


      .overlay-right {

        background:

          linear-gradient(

            90deg,

            rgba(0, 0, 0, 0.02) 0%,

            rgba(0, 0, 0, 0.08) 28%,

            rgba(0, 0, 0, 0.42) 48%,

            rgba(0, 0, 0, 0.86) 72%,

            rgba(0, 0, 0, 0.98) 100%

          );

      }



      .school-link {

        top:
          28px;

        right:
          30px;


        width:
          65vw;

      }



      .school-name-chinese,
      .school-name-english {

        font-size:

          clamp(
            18px,
            2.3vw,
            24px
          );

      }



      .content {

        right:
          35px;

        width:
          52vw;

      }



      .title-line {

        font-size:

          clamp(
            35px,
            5.6vw,
            59px
          );

      }

    }



    /* ==================================================
       19. MOBILE
    ================================================== */

    @media (
      max-width: 600px
    ) {


      body {

        overflow:
          hidden;

      }



      .background {

        top:
          -45px;

        left:
          -45px;

        right:
          -45px;

        bottom:
          -45px;


        background-position:
          35% center;


        transform:
          translateY(22px)
          scale(1.045);


        animation:
          mobileBackgroundZoom
          10s
          ease
          forwards;

      }



      .overlay-right {

        background:

          linear-gradient(

            180deg,

            rgba(0, 0, 0, 0.06) 0%,

            rgba(0, 0, 0, 0.10) 30%,

            rgba(0, 0, 0, 0.48) 55%,

            rgba(0, 0, 0, 0.90) 73%,

            rgba(0, 0, 0, 0.99) 100%

          );

      }



      .school-link {

        top:
          20px;

        left:
          20px;

        right:
          20px;


        width:
          auto;


        text-align:
          right;

      }



      .school-name-chinese {

        font-size:
          18px;


        line-height:
          1.2;


        letter-spacing:
          0.07em;


        margin-bottom:
          7px;

      }



      .school-name-english {

        font-size:
          18px;


        line-height:
          1.12;


        letter-spacing:
          0;


        opacity:
          0.72;

      }



      .content {

        left:
          21px;

        right:
          21px;

        top:
          auto;

        bottom:
          32px;


        width:
          auto;


        transform:
          none;


        text-align:
          right;

      }



      .title-line {

        font-size:

          clamp(
            33px,
            10.5vw,
            50px
          );


        line-height:
          1.01;

      }



      .chinese-title {

        margin-top:
          18px;

        font-size:
          18px;

      }



      .chinese-title::after {

        margin-top:
          13px;

      }



      .language-area {

        flex-direction:
          column;

        align-items:
          flex-end;

        gap:
          9px;

        margin-top:
          21px;

      }



      .language-button {

        width:
          100%;

        min-width:
          0;

      }



      .footer-note {

        display:
          none;

      }

    }



    /* ==================================================
       20. MOBILE BACKGROUND ANIMATION
    ================================================== */

    @keyframes mobileBackgroundZoom {

      from {

        transform:
          translateY(22px)
          scale(1.065);

      }


      to {

        transform:
          translateY(22px)
          scale(1.025);

      }

    }



    /* ==================================================
       21. REDUCED MOTION
    ================================================== */

    @media (
      prefers-reduced-motion:
      reduce
    ) {

      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;

      }

    }

  </style>

</head>



<body>


  <main
    class="landing"
    id="landing"
  >



    <!-- ======================================
         BACKGROUND PHOTO
    ======================================= -->

    <div
      class="background"
    ></div>



    <!-- ======================================
         RIGHT BLACK GRADIENT
    ======================================= -->

    <div
      class="overlay-right"
    ></div>



    <!-- ======================================
         EDGE DARKENING
    ======================================= -->

    <div
      class="overlay-edge"
    ></div>



    <!-- ======================================
         SCHOOL NAME

         右上角。

         中文與英文目前皆放大到
         與「數理資優班」相同字級。

         點擊前往誠正國中校網。
    ======================================= -->

    <a
      class="school-link"
      href="https://www.ccjh.tp.edu.tw/nss/p/index"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="前往臺北市立誠正國民中學官方網站"
    >


      <div
        class="school-name-chinese"
      >

        臺北市立誠正國民中學

      </div>


      <div
        class="school-name-english"
      >

        Taipei Municipal Cheng-Zheng
        <br>
        Junior High School

      </div>


    </a>



    <!-- ======================================
         MAIN CONTENT
    ======================================= -->

    <section
      class="content"
    >



      <!-- ====================================
           ENGLISH PROGRAM NAME
      ===================================== -->

      <h1
        class="main-title"
      >


        <span
          class="title-line"
        >

          Math &amp; Science

        </span>


        <span
          class="title-line emphasis"
        >

          Gifted and Talented

        </span>


        <span
          class="title-line"
        >

          Education Program

        </span>


      </h1>



      <!-- ====================================
           CHINESE PROGRAM NAME
      ===================================== -->

      <div
        class="chinese-title"
      >

        數理資優班

      </div>



      <!-- ====================================
           LANGUAGE SELECTION
      ===================================== -->

      <div
        class="language-area"
      >



        <!-- 中文 -->

        <a
          href="zh/"
          class="language-button page-link"
        >


          <span>

            中文

          </span>


          <span
            class="arrow"
          >

            →

          </span>


        </a>



        <!-- English -->

        <a
          href="en/"
          class="language-button page-link"
        >


          <span>

            English

          </span>


          <span
            class="arrow"
          >

            →

          </span>


        </a>


      </div>


    </section>



    <!-- ======================================
         OPTIONAL FOOTER SLOGAN

         目前關閉。

         程式碼保留。

         未來若需要，
         移除下面的 HTML 註解即可。


    <div
      class="footer-note"
    >

      Explore · Discover · Create

    </div>


    ======================================= -->



    <!-- ======================================
         OPTIONAL YEAR

         目前關閉。

         程式碼保留。


    <div
      class="year"
    >

      2026

    </div>


    ======================================= -->


  </main>



  <script>

    /* ==================================================
       LANGUAGE PAGE TRANSITION
    ================================================== */


    const links =
      document.querySelectorAll(
        ".page-link"
      );


    const landing =
      document.getElementById(
        "landing"
      );



    links.forEach(

      link => {


        link.addEventListener(

          "click",

          function(event) {


            event.preventDefault();


            const target =
              this.getAttribute(
                "href"
              );


            landing.classList.add(
              "leaving"
            );


            setTimeout(

              () => {


                window.location.href =
                  target;


              },

              430

            );


          }

        );


      }

    );

  </script>


</body>

</html>
