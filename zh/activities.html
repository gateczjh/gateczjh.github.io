---
layout: zh-page
title: 活動紀錄
---

<main class="page-shell">

  <div class="page-title-block">

    <h1 class="page-title">
      活動紀錄
    </h1>

    <div class="page-title-en">
      Activities
    </div>

  </div>


  <div class="activity-search-wrap">

    <label
      class="activity-search-label"
      for="activitySearch"
    >
      搜尋貼文
    </label>

    <input
      class="activity-search"
      id="activitySearch"
      type="search"
      placeholder="輸入活動名稱、關鍵字或日期"
      autocomplete="off"
      data-activity-search
    >

    <div
      class="search-count"
      data-search-count
    ></div>

  </div>


  <div class="activity-feed">

    {% assign zh_posts = site.posts | where: "lang", "zh" %}

    {% for post in zh_posts %}

      <article
        class="feed-post"
        data-post-item
        data-title="{{ post.title | escape }}"
        data-date="{{ post.date | date: '%Y.%m.%d' }}"
      >


        <a
          class="feed-cover"
          href="{{ post.url | relative_url }}"
        >

          {% if post.cover %}

            <img
              src="{{ post.cover | relative_url }}"
              alt="{{ post.title }}"
            >

          {% else %}

            <div class="feed-placeholder">
              ACTIVITY
            </div>

          {% endif %}

        </a>


        <div class="feed-content">

          <div class="feed-date">
            {{ post.date | date: "%Y.%m.%d" }}
          </div>

          <h2 class="feed-title">
            <a href="{{ post.url | relative_url }}">
              {{ post.title }}
            </a>
          </h2>

          

          <a
            class="feed-read"
            href="{{ post.url | relative_url }}"
          >
            閱讀文章 →
          </a>

        </div>


      </article>

    {% endfor %}

  </div>


  <div
    class="no-search-results"
    data-no-results
  >
    找不到符合條件的文章。
  </div>


  <script src="{{ '/js/activities.js' | relative_url }}"></script>

</main>
